[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "strava-openapi-mcp"
version = "0.1.0"
description = "Generic MCP stdio proxy generated from the official Strava Swagger specification"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Strava OpenAPI MCP contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
  "mcp>=1.9,<2",
  "openapi-spec-validator>=0.7.1,<1",
  "pydantic>=2.7,<3",
]

[project.scripts]
strava-mcp = "strava_mcp.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/strava_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
